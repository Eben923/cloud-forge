name: Cloud Forge CI

on:
  push:
    branches: [ main, strengthen ]
  pull_request:
    branches: [ main, strengthen ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx cfn-lint

      - name: Run Pytest Test Suite
        run: |
          pytest tests/ -v

      - name: Validate CloudFormation Template
        run: |
          python -c "import pathlib, cfnlint.api; m = cfnlint.api.lint_file(pathlib.Path('infra/cloudforge.yaml')); [print(match) for match in m]; exit(1) if m else print('CloudFormation template valid (0 errors).')"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint Frontend
        working-directory: frontend
        run: npm run lint

      - name: Build Frontend
        working-directory: frontend
        run: npm run build
